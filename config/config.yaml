#window_params:
window_size: 30
forecast_horizon: 1
n_features: 7
batch_size: 32
stride: 1
input_scale: 100  # factor for the return inputs (1: raw log returns, 100: percent; chosen on validation)
target_scale: 1  # the output layer learns the targets times this factor; predictions stay log returns
readout: last  # summary of the time steps before the output layer: mean (all steps) or last (chosen on validation)
calendar: current  # calendar features of each input day (current) or of the next trading day (next)
expiry_features: false  # add dummies for the third Friday and the quarterly expiry to the calendar features
revin: false  # reversible instance normalization of each window's series input (patterndecoder/revin.py); chosen for volume and volatility (results/revin.md)
shuffle_buffer: 1000
#training_params:
# loss, learning_rate, dropout, d_model and units were chosen by the validation
# search in patterndecoder/tuning.py (workflow "Hyperparameter search")
learning_rate: 1.0e-04
epochs: 50
early_stopping: True
restore_best: True
patience: 10
tmp_weights_file: models/weights/
tmp_history_file: models/history/
dropout: 0.3
l1_reg: 0.000001
l2_reg: 0.00001
metrics:
  - mae
loss:
  - mae
optimizer: tensorflow.keras.optimizers.AdamW
verbose: False
seed: 5  # chosen under the earlier setup as the study seed where PatternDecoder did best; kept for the current setup
training: True
#transformer_params:
d_model: 16
n_heads: 4
units: 64
n_layers_enc: 2  # shared by all models; chosen on the validation split in the seed and layer study
n_layers_dec: 1
activation: gelu
#data_params:
data_path: data/
ticker: "^GDAXI"
type: csv
date_column: Date
columns:
  - Close
target_column: "Close"
series: log_return  # series to forecast: log_return, parkinson (daily volatility from high and low) or log_volume
start: "2021-02-05"
end: "2026-02-06"  # exclusive: the last trading day used is 2026-02-05
# SHA-256 of date and Close (4 decimals) of the data used for the published results
data_checksum: 28716478c49a50d6dd37b27303760644c3a3e928dc912966d505e32f9b02390b
interval: 1d
train_split: 0.7
validation_split: 0.2  # last share of the training data, used for epoch selection
