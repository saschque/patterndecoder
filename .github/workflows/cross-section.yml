name: Cross-section evaluation

# Trains all models on a panel of stocks for several seeds and test windows and
# evaluates how well they rank the stocks by their next-day excess return
# (patterndecoder/cross_section.py). Started by hand only. The panel is the DAX
# members of 20 March 2023 (DAX-PANEL) or the synthetic positive control
# (SYNTH-PANEL); single config values can be changed, all other settings come
# from config/config.yaml.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Panel: DAX-PANEL (DAX members of 20 March 2023) or SYNTH-PANEL (positive control)"
        required: true
        default: "DAX-PANEL"
      overrides:
        description: 'Config values to change (JSON object, e.g. {"revin": true})'
        required: true
        default: "{}"
      seeds:
        description: "Seeds (JSON list)"
        required: true
        default: "[1, 2, 3, 4]"
      windows:
        description: "Start of each test window as a share of the data (JSON list; width 0.1)"
        required: true
        default: "[0.5, 0.6, 0.7, 0.8, 0.9]"

permissions:
  contents: read

env:
  TICKER: ${{ inputs.ticker }}
  OVERRIDES: ${{ inputs.overrides }}

jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.data-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure panel and settings
        run: .github/scripts/configure-run.sh

      - name: Cache key for the panel data
        id: data-key
        run: |
          key=$({ grep -E '^(data_path|ticker|start|end):' config/config.yaml; cat patterndecoder/panel.py; } | sha256sum | cut -c1-16)
          echo "key=panel-data-${key}" >> "$GITHUB_OUTPUT"

      - name: Restore panel data
        id: cache
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ steps.data-key.outputs.key }}

      - name: Set up Python 3.10
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download and describe the panel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install $(grep -E '^(numpy|pandas|pyyaml|yfinance)==' requirements.txt)
          python -m patterndecoder.panel

  run:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
        start: ${{ fromJSON(inputs.windows) }}
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure panel and settings
        run: .github/scripts/configure-run.sh

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore panel data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true

      - name: Train all models for one seed and one test window
        run: |
          mkdir -p xs-out
          python -m patterndecoder.cross_section run --seed ${{ matrix.seed }} \
            --test-start ${{ matrix.start }} --out xs-out/s${{ matrix.seed }}_w${{ matrix.start }}.csv

      - name: Upload forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xs-s${{ matrix.seed }}-w${{ matrix.start }}
          path: xs-out/*.csv

  summarize:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download forecasts
        uses: actions/download-artifact@v4
        with:
          pattern: xs-*
          path: xs-results
          merge-multiple: true

      - name: Summarize
        run: |
          echo "### ${TICKER}, overrides ${OVERRIDES}" >> "$GITHUB_STEP_SUMMARY"
          python -m patterndecoder.cross_section summarize xs-results/*.csv --out xs-summary.csv
          echo "--- pooled"; cat xs-summary.csv
          echo "--- windows"; cat xs-summary_windows.csv

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: cross-section-summary
          path: |
            xs-summary.csv
            xs-summary_windows.csv
