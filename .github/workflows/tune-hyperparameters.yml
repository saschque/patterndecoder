name: Hyperparameter search

# Grid search on the validation split (see patterndecoder/tuning.py). Started
# by hand only. The test set is not used; results are in the job summary and
# as CSV artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.data-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key for the market data
        id: data-key
        run: |
          key=$(grep -E '^(data_path|ticker|type|start|end|interval):' config/config.yaml | sha256sum | cut -c1-16)
          echo "key=market-data-${key}" >> "$GITHUB_OUTPUT"

      - name: Restore market data
        id: cache
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ steps.data-key.outputs.key }}

      - name: Set up Python 3.10
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download and check market data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install $(grep -E '^(numpy|pandas|pyyaml|yfinance)==' requirements.txt)
          python -m patterndecoder.data

  search:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        model: [transformer, autoformer, informer, patterndecoder]
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true

      - name: Run grid for ${{ matrix.model }}
        run: |
          mkdir -p results
          python -m patterndecoder.tuning run \
            --model models/${{ matrix.model }}.yaml \
            --out results/${{ matrix.model }}.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-${{ matrix.model }}
          path: results/${{ matrix.model }}.csv

  summarize:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: tuning-*
          path: results
          merge-multiple: true

      - name: Summarize
        run: python -m patterndecoder.tuning summarize results/*.csv
