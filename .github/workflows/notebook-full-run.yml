name: Notebook full run

# Retrains all models and executes patterndecoder_evaluation_study.ipynb from
# top to bottom. Started by hand only (Actions -> "Notebook full run" ->
# "Run workflow"), because a full run takes several hours on a CPU runner.
# The executed notebook, the weights and the training histories are attached
# to the run as an artifact. With push_results they are also pushed to a new
# branch notebook-run/<run number>; nothing is ever pushed to main.

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per model (config default: 50)"
        required: true
        default: "50"
      push_results:
        description: "Also push the executed notebook, weights and histories to branch notebook-run/<run number>"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notebook-full-run
  cancel-in-progress: false

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    # GitHub-hosted runners stop a job after 6 hours; stop a little earlier so
    # the partial notebook and the weights trained so far are still uploaded.
    timeout-minutes: 345
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt papermill==2.7.0 ipykernel==7.3.0
          python -m ipykernel install --user --name python3
          pip freeze > pip-freeze.txt

      - name: Configure training run
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: |
          if ! [[ "$EPOCHS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::epochs must be a positive integer, got '$EPOCHS'"
            exit 1
          fi
          sed -i -E "s/^epochs:.*/epochs: ${EPOCHS}/; s/^training:.*/training: True/" config/config.yaml
          grep -E '^(epochs|training):' config/config.yaml

      - name: Execute notebook
        run: |
          mkdir -p output
          papermill patterndecoder_evaluation_study.ipynb \
            output/patterndecoder_evaluation_study.ipynb \
            --kernel python3 --cwd . --log-output --progress-bar

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-full-run-${{ github.run_number }}
          path: |
            output/patterndecoder_evaluation_study.ipynb
            models/weights/
            models/history/
            config/config.yaml
            pip-freeze.txt
          retention-days: 30

      - name: Push results to a branch
        if: inputs.push_results
        run: |
          cp output/patterndecoder_evaluation_study.ipynb patterndecoder_evaluation_study.ipynb
          git checkout config/config.yaml
          branch="notebook-run/${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add patterndecoder_evaluation_study.ipynb models/history
          git add -f models/weights/*.keras
          git commit -m "Executed notebook, weights and histories of run ${{ github.run_number }}"
          git push origin "$branch"

      - name: Summary
        if: always()
        env:
          EPOCHS: ${{ inputs.epochs }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Notebook full run"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Epochs per model: ${EPOCHS}"
            echo "- Executed notebook, weights, histories and package versions: artifact \`notebook-full-run-${{ github.run_number }}\`"
            echo "- Seeds are not fixed, so results differ from run to run."
          } >> "$GITHUB_STEP_SUMMARY"
